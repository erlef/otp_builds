name: Sync OTP versions
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum number of builds to dispatch"
        default: "5"
      dry-run:
        type: boolean
        default: false
  schedule:
    # Run every 30min
    - cron: '*/30 * * * *'
jobs:
  sync_otp_versions:
    name: "Sync OTP versions"
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.elixir-install
          key: elixir-install

      - name: "Sync OTP versions"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_LIMIT: ${{ inputs.limit || '5' }}
          SYNC_DRY_RUN: ${{ inputs.dry-run && '1' || '0' }}
        run: |
          ./scripts/elixir-install.sh elixir@1.17.3 otp@27.1.2
          export PATH="$HOME/.elixir-install/installs/elixir/1.17.3-otp-27/bin:$PATH"
          export PATH="$HOME/.elixir-install/installs/otp/27.1.2/bin:$PATH"

          ./scripts/sync_otp_versions.exs
